<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAT OFFICE 시간대 검수</title>
  <style>
    :root { color-scheme: light; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #efe5d2; color: #2f241c; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    main { width: min(1180px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: clamp(22px, 4vw, 36px); }
    p { margin: 0 0 16px; color: #715d4c; }
    .stage { overflow: hidden; border: 2px solid #4c3527; border-radius: 22px; background: #171310; box-shadow: 0 18px 45px #51362233; }
    .stage img { display: block; width: 100%; height: auto; }
    .controls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
    button { min-height: 48px; border: 1px solid #b59b7f; border-radius: 13px; background: #fffaf0; color: #38271d; font: inherit; font-weight: 800; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #8f1532; background: #8f1532; color: #fffaf4; }
    @media (max-width: 600px) { body { padding: 10px; } .controls { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main>
    <h1>CAT OFFICE 시간대 검수</h1>
    <p>구도는 고정하고 창밖과 조명만 비교함.</p>
    <div class="stage"><img id="room" src="../rooms/cat-office-time-day.webp" alt="고양이 집사 사무실 낮"></div>
    <div class="controls" aria-label="시간대 선택">
      <button type="button" data-room="dawn" aria-pressed="false">새벽</button>
      <button type="button" data-room="morning" aria-pressed="false">아침</button>
      <button type="button" data-room="day" aria-pressed="true">낮</button>
      <button type="button" data-room="sunset" aria-pressed="false">석양</button>
      <button type="button" data-room="night-on" aria-pressed="false">밤 · 조명 켬</button>
      <button type="button" data-room="night-off" aria-pressed="false">밤 · 조명 끔</button>
    </div>
  </main>
  <script>
    const room = document.querySelector('#room');
    document.querySelectorAll('[data-room]').forEach((button) => {
      button.addEventListener('click', () => {
        const state = button.dataset.room;
        room.src = `../rooms/cat-office-time-${state}.webp`;
        room.alt = `고양이 집사 사무실 ${button.textContent.trim()}`;
        document.querySelectorAll('[data-room]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
  </script>
</body>
</html>
