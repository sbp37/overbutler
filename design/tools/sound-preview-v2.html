  <style>

    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(145deg,#dfcfad,#cbb58f); font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.18; background-image:radial-gradient(#765f42 .55px,transparent .8px); background-size:7px 7px; }
    button,input { font:inherit; }
    main { position:relative; width:min(820px,100%); margin:auto; min-height:100vh; padding:22px 16px 72px; }

    .play:active { transform:translateY(1px); }

    .play span { display:block; margin-top:7px; color:var(--soft); font-size:11px; line-height:1.38; }

      .desk-actions { justify-content:space-between; }
      .volume { flex:1; }
      .volume input { width:min(150px,42vw); }
      section { padding:15px 11px 12px; }
      .grid { grid-template-columns:1fr; }
      .play { min-height:82px; }
    }

</main>

<script>

    ['B','리본 풀기','giftRibbon','종이 질감 뒤 작은 화음','저자극'],
    ['C','관계 흔적','giftBond','두 음이 포개지는 포근한 확인','따뜻함'],
    ['D','봉인 해제','giftUnlock','낮은 음부터 천천히 열리는 게임 보상','게임 UI']
  ]},
  { title:'조명', role:'밤 방에서 거슬리지 않는 스위치', sounds:[

    ['B','켜짐','lampOn','짧게 위로 올라가는 둥근 음','게임 UI'],
    ['C','꺼짐','lampOff','짧게 아래로 내려가는 둥근 음','낮은 톤']
  ]}

let ctx = null;
let master = null;
let liveSources = new Set();
let activeCard = null;
let finishTimer = 0;
const picked = new Set();

function audioContext() {
  if (!ctx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    ctx = new AudioContextClass();
    master = ctx.createGain();
    master.gain.value = Number(document.querySelector('#volume').value) / 100;
    master.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function track(source) {
  liveSources.add(source);
  source.addEventListener('ended', () => liveSources.delete(source), { once:true });
  return source;
}

function envelope(gain, start, duration, peak, attack=.012, release=.06) {
  const end = start + duration;
  gain.setValueAtTime(.0001, start);
  gain.exponentialRampToValueAtTime(Math.max(.0002, peak), start + attack);
  gain.setValueAtTime(Math.max(.0002, peak), Math.max(start + attack, end - release));
  gain.exponentialRampToValueAtTime(.0001, end);
}

function tone({ at=0, duration=.12, freq=300, type='sine', gain=.08, attack=.01, release=.05, lowpass=0, vibrato=0 }) {
  const c = audioContext();
  const start = c.currentTime + .018 + at;
  const osc = track(c.createOscillator());
  const amp = c.createGain();
  const values = Array.isArray(freq) ? freq : [freq];
  osc.type = type;
  osc.frequency.setValueAtTime(values[0], start);
  values.slice(1).forEach((value, index) => osc.frequency.exponentialRampToValueAtTime(value, start + duration * (index + 1) / (values.length - 1)));
  envelope(amp.gain, start, duration, gain, attack, release);
  if (vibrato) {
    const lfo = track(c.createOscillator());
    const amount = c.createGain();
    lfo.frequency.value = vibrato;
    amount.gain.value = 9;
    lfo.connect(amount).connect(osc.detune);
    lfo.start(start); lfo.stop(start + duration);
  }
  if (lowpass) {
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = lowpass; filter.Q.value = .7;
    osc.connect(filter).connect(amp).connect(master);
  } else osc.connect(amp).connect(master);
  osc.start(start); osc.stop(start + duration + .01);
}

function noise({ at=0, duration=.09, gain=.035, frequency=700, type='lowpass', q=.8, attack=.005, release=.05 }) {
  const c = audioContext();
  const start = c.currentTime + .018 + at;
  const buffer = c.createBuffer(1, Math.ceil(c.sampleRate * duration), c.sampleRate);
  const data = buffer.getChannelData(0);
  let smooth = 0;
  for (let i=0;i<data.length;i++) { smooth = smooth * .72 + (Math.random()*2-1) * .28; data[i] = smooth; }
  const source = track(c.createBufferSource());
  const filter = c.createBiquadFilter();
  const amp = c.createGain();
  source.buffer = buffer;
  filter.type = type; filter.frequency.value = frequency; filter.Q.value = q;
  envelope(amp.gain, start, duration, gain, attack, Math.min(release,duration*.7));
  source.connect(filter).connect(amp).connect(master);
  source.start(start); source.stop(start + duration + .01);
}

function catVoice(path, duration=.34, level=.052) {
  tone({duration,freq:path,type:'triangle',gain:level,attack:.035,release:.1,lowpass:1450,vibrato:18});
  tone({duration,freq:path.map(value=>value*2.02),type:'sine',gain:level*.18,attack:.04,release:.11,lowpass:1900,vibrato:16});
  noise({at:.015,duration:duration*.82,gain:.008,frequency:980,type:'bandpass',q:2.2,attack:.04,release:.1});
}

const sound = {

  catNyang(){ catVoice([340,470,590,410,300],.42,.047); },
  catPurr(){ tone({duration:.42,freq:[72,68],type:'sawtooth',gain:.018,attack:.025,release:.12,lowpass:210,vibrato:24}); noise({duration:.4,gain:.012,frequency:160,release:.13}); catVoice([270,325,255],.22,.034); },

  navWarm(){ tone({duration:.1,freq:220,type:'sine',gain:.035,lowpass:700}); tone({at:.065,duration:.12,freq:285,type:'sine',gain:.038,lowpass:750}); },
  navPaper(){ noise({duration:.095,gain:.021,frequency:1050,type:'bandpass',q:1.3}); tone({duration:.07,freq:190,type:'triangle',gain:.025,lowpass:500}); },
  navBlup(){ tone({duration:.16,freq:[205,285,250],type:'sine',gain:.052,attack:.012,release:.09}); },
  navWood(){ noise({duration:.06,gain:.032,frequency:430}); tone({duration:.11,freq:[185,160],type:'triangle',gain:.04,lowpass:650}); },
  stampSoft(){ noise({duration:.13,gain:.065,frequency:310,release:.09}); tone({duration:.18,freq:[135,105],type:'triangle',gain:.075,release:.13,lowpass:400}); },
  stampRound(){ sound.stampSoft(); tone({at:.11,duration:.2,freq:[285,315],type:'sine',gain:.037,release:.15}); },
  stampTiny(){ noise({duration:.05,gain:.03,frequency:650}); tone({duration:.09,freq:[260,215],gain:.035}); tone({at:.07,duration:.13,freq:380,gain:.035,release:.1}); },
  stampOffice(){ noise({duration:.14,gain:.055,frequency:260}); tone({duration:.21,freq:[115,92],type:'triangle',gain:.065,release:.15,lowpass:350}); noise({at:.1,duration:.08,gain:.018,frequency:900,type:'bandpass'}); },
  paperOpen(){ noise({duration:.38,gain:.026,frequency:1550,type:'bandpass',q:.7,attack:.03,release:.16}); tone({duration:.12,freq:[180,145],gain:.018,lowpass:450}); },

  giftRibbon(){ noise({duration:.3,gain:.022,frequency:1700,type:'bandpass',q:.8,release:.15}); tone({at:.16,duration:.35,freq:349,type:'triangle',gain:.03,release:.27}); tone({at:.21,duration:.38,freq:440,type:'sine',gain:.023,release:.3}); },
  giftBond(){ tone({duration:.38,freq:[294,310],type:'triangle',gain:.038,release:.29,lowpass:1000}); tone({at:.08,duration:.44,freq:[392,415],type:'sine',gain:.032,release:.34}); },
  giftUnlock(){ [220,277,330,415].forEach((freq,index)=>tone({at:index*.085,duration:.38,freq,type:'triangle',gain:.034,release:.29,lowpass:1100})); },
  lampSwitch(){ noise({duration:.045,gain:.028,frequency:460}); tone({at:.025,duration:.12,freq:[285,250],type:'sine',gain:.035,release:.085}); },
  lampOn(){ tone({duration:.17,freq:[240,335],type:'sine',gain:.045,release:.1}); },
  lampOff(){ tone({duration:.18,freq:[330,225],type:'sine',gain:.045,release:.11}); }
};

const root = document.querySelector('#sections');
groups.forEach((group, groupIndex) => {
  const section = document.createElement('section');
  section.innerHTML = `<div class="section-head"><div><h2>${group.title}</h2><p>${group.role}</p></div><span class="section-no">0${groupIndex+1}</span></div><div class="grid"></div>`;
  const grid = section.querySelector('.grid');
  group.sounds.forEach(([code,name,key,description,toneLabel]) => {
    const card = document.createElement('div');
    card.className = 'sound-card';
    card.dataset.id = `${group.title} · ${code} ${name}`;
    card.innerHTML = `<button class="play" type="button"><b class="code">${code}</b><strong>${name}</strong><span>${description}</span><span class="tone">${toneLabel}</span></button><button class="pick" type="button" aria-pressed="false" aria-label="${name} 후보로 표시"></button>`;
    card.querySelector('.play').addEventListener('click', () => playSound(card, group.title, name, key));
    card.querySelector('.pick').addEventListener('click', event => togglePick(card, event.currentTarget));
    grid.append(card);
  });
  root.append(section);
});

function stopSources(resetLabel=true) {
  window.clearTimeout(finishTimer);
  liveSources.forEach(source => { try { source.stop(); } catch (_) {} });
  liveSources.clear();
  activeCard?.classList.remove('is-active');
  activeCard = null;
  if (resetLabel) document.querySelector('#now').textContent = '재생 대기 중';
}

function playSound(card, group, name, key) {
  stopSources(false);
  activeCard = card;
  card.classList.add('is-active');
  document.querySelector('#now').textContent = `${group} · ${name}`;
  sound[key]();
  finishTimer = window.setTimeout(() => {
    card.classList.remove('is-active');
    if (activeCard === card) activeCard = null;
    document.querySelector('#now').textContent = '재생 대기 중';
  }, group.includes('고양이') || group.includes('선물') ? 850 : 600);
}

function togglePick(card, button) {
  const id = card.dataset.id;
  if (picked.has(id)) picked.delete(id); else picked.add(id);
  button.setAttribute('aria-pressed', String(picked.has(id)));
  document.querySelector('#picked').textContent = picked.size ? [...picked].join(' / ') : '아직 선택 없음';
}

document.querySelector('#stop').addEventListener('click', () => stopSources());
document.querySelector('#volume').addEventListener('input', event => {
  if (master) master.gain.setTargetAtTime(Number(event.target.value)/100, ctx.currentTime, .015);
});
</script>
</body>
</html>
