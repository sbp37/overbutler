<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>과잉집사 브랜드 에셋 원본</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;800;900&amp;family=Gaegu:wght@700&amp;display=swap">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#d8c9b8;color:#342828;font-family:"Noto Serif KR",serif}
    .asset{position:relative;overflow:hidden;background:#f7f0e5}
    .asset:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(104,75,61,.08) .7px,transparent .8px);background-size:14px 14px;opacity:.34;pointer-events:none}
    .wordmark strong{display:block;color:#741b2b;font-weight:900;letter-spacing:-.09em}
    .wordmark span{display:block;color:#775b4e;font-family:Arial,sans-serif;font-weight:800;letter-spacing:.22em}
    .office-state{display:inline-flex;align-items:center;gap:12px;border:2px solid #d4c3ad;border-radius:999px;background:#fffaf2;color:#4e3d37;font-family:Arial,sans-serif;font-weight:700}
    .office-state i{width:13px;height:13px;border-radius:50%;background:#8b1d30;box-shadow:0 0 0 6px rgba(139,29,48,.08)}

    #icon{width:1024px;height:1024px;padding:72px;background:linear-gradient(145deg,#fffaf0,#efe0cd)}
    #icon .icon-frame{position:relative;display:grid;place-items:center;width:100%;height:100%;border:6px solid #b99a70;border-radius:210px;background:#fffaf1;box-shadow:inset 0 0 0 18px #f3e8da,0 30px 70px rgba(73,42,37,.16)}
    #icon .icon-frame:before,#icon .icon-frame:after{content:"";position:absolute;width:88px;height:12px;border-radius:99px;background:#b99a70}
    #icon .icon-frame:before{left:70px;top:78px;transform:rotate(-8deg)}
    #icon .icon-frame:after{right:70px;bottom:78px;transform:rotate(-8deg)}
    #icon .seal{position:relative;display:grid;place-items:center;width:630px;height:630px;border:17px double #851d30;border-radius:50%;background:#7b1829;color:#fff9ec;box-shadow:0 18px 0 #5e1120,0 28px 48px rgba(74,30,32,.24);transform:rotate(-3deg)}
    #icon .seal:before{content:"OVERBUTLER";position:absolute;top:40px;left:50%;width:530px;height:530px;border:3px dashed rgba(255,249,236,.7);border-radius:50%;padding-top:33px;text-align:center;font:800 24px Arial,sans-serif;letter-spacing:.22em;transform:translateX(-50%)}
    #icon .seal b{position:absolute;left:50%;top:185px;font-size:202px;line-height:.78;letter-spacing:-.12em;transform:translateX(-50%);white-space:nowrap}
    #icon .seal small{position:absolute;left:50%;top:430px;font:800 52px/1 Arial,sans-serif;letter-spacing:.2em;transform:translateX(-50%);white-space:nowrap}

    #share{width:1200px;height:630px;padding:56px 62px}
    #share .frame{position:relative;width:100%;height:100%;border:3px solid #c9b494;border-radius:38px;background:rgba(255,252,245,.93);box-shadow:0 20px 48px rgba(68,43,37,.12);overflow:hidden}
    #share .frame:after{content:"공식 대업 접수처";position:absolute;right:43px;top:38px;padding:11px 17px;border:2px solid #9a3040;border-radius:7px;color:#8a2132;font:800 19px Arial,sans-serif;letter-spacing:.04em;transform:rotate(3deg)}
    #share .copy{position:absolute;z-index:2;left:54px;top:47px;width:510px}
    #share .wordmark strong{font-size:80px;line-height:1}
    #share .wordmark span{margin:12px 0 54px;font-size:15px}
    #share h1{margin:0;color:#3e3030;font-size:46px;line-height:1.35;letter-spacing:-.07em}
    #share h1 em{color:#7e1b2d;font-style:normal}
    #share p{margin:24px 0 0;color:#725f56;font:700 29px/1.3 "Gaegu",cursive}
    #share .crew{position:absolute;right:16px;bottom:-34px;width:630px;height:500px}
    #share .crew img{position:absolute;bottom:0;height:430px;object-fit:contain;object-position:center bottom;filter:none}
    #share .crew .ai{left:10px;width:220px;z-index:4}
    #share .crew .cat{left:174px;width:175px;z-index:3}
    #share .crew .dog{left:300px;width:205px;z-index:2}
    #share .crew .fairy{left:448px;width:190px;z-index:1}
    #share .desk-line{position:absolute;right:32px;bottom:35px;width:610px;height:16px;border-radius:50%;background:rgba(93,58,45,.14);filter:blur(8px)}

    #splash{width:1170px;height:2532px;padding:118px 92px;background:linear-gradient(180deg,#fffaf2 0%,#f6eddf 62%,#ead9c5 100%)}
    #splash .splash-frame{position:relative;width:100%;height:100%;border:4px solid #cbb593;border-radius:72px;background:rgba(255,251,244,.7);overflow:hidden}
    #splash .splash-frame:before{content:"";position:absolute;inset:26px;border:2px solid rgba(167,137,99,.28);border-radius:55px}
    #splash .wordmark{position:absolute;left:0;right:0;top:220px;text-align:center}
    #splash .wordmark strong{font-size:142px;line-height:1}
    #splash .wordmark span{margin-top:26px;font-size:22px}
    #splash .bureau{position:absolute;left:50%;top:490px;transform:translateX(-50%);padding:18px 30px;border-top:2px solid #bda47f;border-bottom:2px solid #bda47f;color:#775b4e;font:800 27px Arial,sans-serif;letter-spacing:.2em;white-space:nowrap}
    #splash .splash-character{position:absolute;left:50%;bottom:122px;width:900px;height:1390px;object-fit:contain;object-position:center bottom;transform:translateX(-50%);filter:none}
    #splash .speech{position:absolute;z-index:2;left:50%;top:705px;width:760px;padding:36px 45px;border:3px solid #cfbda5;border-radius:35px;background:#fffdf8;color:#533f3b;text-align:center;transform:translateX(-50%);box-shadow:0 16px 36px rgba(69,43,38,.08);font:700 52px/1.35 "Gaegu",cursive}
    #splash .speech:after{content:"";position:absolute;left:50%;bottom:-23px;width:42px;height:42px;border-right:3px solid #cfbda5;border-bottom:3px solid #cfbda5;background:#fffdf8;transform:translateX(-50%) rotate(45deg)}
    #splash .office-state{position:absolute;z-index:3;left:50%;bottom:100px;padding:18px 30px;font-size:23px;transform:translateX(-50%)}
  </style>
</head>
<body>
  <section class="asset" id="icon" aria-label="과잉집사 앱 아이콘">
    <div class="icon-frame"><div class="seal"><b>과잉</b><small>집사</small></div></div>
  </section>

  <section class="asset" id="share" aria-label="과잉집사 공유 이미지">
    <div class="frame">
      <div class="copy">
        <div class="wordmark"><strong>과잉집사</strong><span>OVERBUTLER DUTY OFFICE</span></div>
        <h1>별것 아닌 일을<br><em>공식 대업</em>으로 기록합니다.</h1>
        <p>주인님의 작은 행동도 집사가 과하게 칭찬해드려요.</p>
      </div>
      <div class="desk-line"></div>
      <div class="crew">
        <img class="ai" src="../character-assets/ai-butler/ui-poses/ai-base.png" alt="">
        <img class="cat" src="../character-assets/cat-butler/ui-poses/cat-base.png" alt="">
        <img class="dog" src="../character-assets/dog-butler/ui-poses/dog-base.png" alt="">
        <img class="fairy" src="../character-assets/fairy-butler/ui-poses/fairy-base.png" alt="">
      </div>
    </div>
  </section>

  <section class="asset" id="splash" aria-label="과잉집사 시작 화면 이미지">
    <div class="splash-frame">
      <div class="wordmark"><strong>과잉집사</strong><span>OVERBUTLER DUTY OFFICE</span></div>
      <div class="bureau">집사 사무국</div>
      <div class="speech">주인님의 사소한 일도<br>대업으로 접수하겠습니다.</div>
      <img class="splash-character" src="../character-assets/ai-butler/ui-poses/ai-base.png" alt="">
      <div class="office-state"><i></i> 사무국 정상 운영 중</div>
    </div>
  </section>
</body>
</html>
