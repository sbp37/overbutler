<!doctype html>
<meta charset="utf-8">
<title>CAT core flow fixture</title>
<script src="fixture-assertions.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  localStorage.removeItem("butlermaker_v1");
  localStorage.removeItem("overbutler-v2-state");

  if (params.has("assert")) {
    runFixtureAssertions({
      target: "../index.html?cat-core-fixture=1&fixture-no-overlay-observer=1",
      check: async (frame, assert, wait) => {
        const until = async (test, timeout = 5000) => {
          const started = Date.now();
          while (!test()) {
            if (Date.now() - started >= timeout) throw new Error("core flow timed out");
            await wait(50);
          }
        };
        let appFrame = frame;
        let doc = appFrame.contentDocument;

        assert(!doc.querySelector("#assignment-screen").hidden, "empty storage opens CAT assignment");
        assert(doc.querySelector("#assignment-screen").textContent.includes("고양이 집사"), "first assigned character is CAT");
        assert(doc.querySelector(".character-line").textContent.includes("주인님이 처음") && doc.querySelector(".character-line").textContent.includes("잘하고 싶어서"), "CAT introduction leads with first-owner rookie enthusiasm");
        assert(!doc.querySelector(".character-line").textContent.includes("특별대우 아니다"), "CAT introduction does not lead with defensive tsundere copy");
        const assignmentCopy = doc.querySelector(".assignment-copy");
        const assignmentCopyStyle = doc.defaultView.getComputedStyle(assignmentCopy);
        assert(assignmentCopyStyle.display !== "none" && assignmentCopyStyle.visibility !== "hidden", "first-assignment world rule is visible on onboarding");
        assert(assignmentCopy.textContent.includes("첫 발령") && assignmentCopy.textContent.includes("생애 첫 주인님"), "onboarding identifies CAT's first assignment and first owner");
        const ownerInput = doc.querySelector("#owner-name-input");
        ownerInput.value = "테스트주인님";
        ownerInput.dispatchEvent(new Event("input", { bubbles: true }));
        doc.querySelector("#accept-butler").click();
        await until(() => doc.querySelector("#assignment-screen").hidden && !doc.querySelector("#main-screen").hidden);
        let stored = JSON.parse(localStorage.getItem("butlermaker_v1"));
        assert.equal(stored.username, "테스트주인님", "onboarding owner name is persisted");
        assert.equal(stored.character, "cat", "onboarding persists CAT assignment");
        await until(() => {
          const copy = doc.querySelector("#cat-home-speech-paper").textContent;
          return copy.includes("잘하고 싶") || copy.includes("첫 발령");
        });
        const firstMeetingCopy = doc.querySelector("#cat-home-speech-paper").textContent;
        assert(firstMeetingCopy.includes("잘하고 싶") || firstMeetingCopy.includes("첫 발령"), "first CAT home greeting keeps rookie enthusiasm or responsibility");
        assert((firstMeetingCopy.match(/테스트주인님/g) || []).length <= 1, "first CAT home greeting does not repeat the owner name");

        const storyInput = doc.querySelector("#achievement-input");
        storyInput.value = "씻었어";
        storyInput.dispatchEvent(new Event("input", { bubbles: true }));
        doc.querySelector("#report-button").click();
        await until(() => !doc.querySelector("#praise-result-overlay").hidden);
        assert(Boolean(doc.querySelector("#result-title").textContent.trim()), "first submission reaches the result sheet");
        assert(doc.querySelector("#result-deed").textContent.includes("씻"), "result sheet reflects the submitted story");
        assert(doc.querySelector("#result-report").textContent.includes("맡긴 첫 이야기") && doc.querySelector("#result-report").textContent.includes("잘하고 싶어서"), "first CAT result shows first-owner rookie enthusiasm");
        assert.equal(doc.querySelector("#result-close").textContent.trim(), "집사에게 돌아가기", "saved first record returns to the butler without offering a second save");
        assert(doc.querySelector("#result-footnote").textContent.includes("주인님 파일 첫 장 보관 완료"), "first CAT result confirms where the shared first record was stored");
        stored = JSON.parse(localStorage.getItem("butlermaker_v1"));
        assert.equal(stored.records.length, 1, "first submission creates one record");
        assert.equal(stored.records[0].sourceText, "씻었어", "record preserves exact sourceText");
        assert(Boolean(stored.records[0].discoveredAchievement), "record preserves discovered achievement");
        assert(stored.records[0].reactionLines.length >= 1 && stored.records[0].reactionLines.length <= 3, "record preserves one to three reaction lines");
        assert.equal(stored.records[0].relationshipStage, "첫 발령", "new CAT record stores the CAT career stage label");
        assert.equal(stored.diary.length, 1, "first submission creates one diary entry");
        assert(stored.diary[0].diaryRevealVersion > 0, "today diary entry is created with reveal version");

        doc.querySelector("#result-close").click();
        await until(() => doc.querySelector("#praise-result-overlay").hidden);
        await until(() => doc.querySelector("#cat-home-speech-text").textContent.includes("주인님 파일 첫 장"));
        assert(doc.querySelector("#cat-home-speech-text").textContent.includes("넣어뒀다냥"), "first result return connects the reward to the owner file");
        doc.querySelector('[data-view="archive"]').click();
        await until(() => doc.querySelector(".office-record-card"));
        assert(doc.querySelector("#archive-butler-role").textContent.includes("첫 담당 집사") && doc.querySelector("#archive-butler-role").textContent.includes("함께 쓴 기록"), "owner file cover carries the first-assignment continuity");
        const recordId = stored.records[0].id;
        const recordCard = doc.querySelector(`[data-record-id="${CSS.escape(String(recordId))}"]`);
        assert(Boolean(recordCard), "owner file renders the new record card");
        recordCard.click();
        await until(() => !doc.querySelector("#record-detail-overlay").hidden);
        assert.equal(doc.querySelector("#record-detail-source").textContent, "씻었어", "record detail shows exact sourceText");
        assert.equal(doc.querySelector("#record-detail-achievement").textContent, stored.records[0].discoveredAchievement, "record detail shows discovered achievement");
        assert(doc.querySelectorAll("#record-detail-reactions p").length >= 1, "record detail shows the original butler reaction");
        assert.equal(doc.querySelector("#record-detail-field-label").textContent, "당시 집사 단계", "CAT record detail labels its stored career stage");
        assert.equal(doc.querySelector("#record-detail-field").textContent, "첫 발령", "CAT record detail preserves the stage at submission time");
        assert(doc.querySelector("#record-detail-note-copy").textContent.includes("함께 시작한 첫 업무"), "first CAT record is identified as the shared first assignment");
        doc.querySelector("#record-detail-back").click();
        await until(() => doc.querySelector("#record-detail-overlay").hidden);
        const teaser = doc.querySelector(".diary-teaser.file-margin-note.sealed");
        assert(Boolean(teaser), "today diary is visible as a sealed teaser");
        assert(teaser.textContent.includes("첫 발령"), "today diary carries the CAT career stage from that entry");
        assert(teaser.textContent.includes("다음 날짜"), "today teaser explains next-date reveal");

        const previousFrame = appFrame;
        const nextFrame = document.createElement("iframe");
        nextFrame.hidden = true;
        const loaded = new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => reject(new Error("core flow reload frame timed out")), 5000);
          nextFrame.addEventListener("load", () => {
            window.clearTimeout(timeout);
            resolve();
          }, { once: true });
        });
        nextFrame.src = "../index.html?cat-core-fixture=1&reload=1&fixture-no-overlay-observer=1";
        document.body.append(nextFrame);
        await loaded;
        appFrame = nextFrame;
        doc = appFrame.contentDocument;
        await new Promise(resolve => {
          previousFrame.addEventListener("load", resolve, { once: true });
          previousFrame.src = "about:blank";
        });
        await wait(250);
        previousFrame.remove();
        stored = JSON.parse(localStorage.getItem("butlermaker_v1"));
        assert.equal(stored.records.length, 1, "reload preserves the submitted record");
        doc.querySelector('[data-view="archive"]').click();
        await until(() => doc.querySelector(`[data-record-id="${CSS.escape(String(recordId))}"]`));
        assert(Boolean(doc.querySelector(".diary-teaser.file-margin-note.sealed")), "reload preserves today's sealed diary teaser");

        stored.giftHistory = [
          { id: "gift-tuna", character: "cat", emoji: "🐟", name: "참치 캔", cost: 80, date: "2026.08.28", at: "2026-08-28T08:00:00.000Z" },
          { id: "gift-ball", character: "cat", emoji: "🧶", name: "방울 공", cost: 55, date: "2026.08.28", at: "2026-08-28T09:00:00.000Z" },
          { id: "gift-tower", character: "cat", emoji: "🏠", name: "캣타워", cost: 300, date: "2026.08.28", at: "2026-08-28T10:00:00.000Z" }
        ];
        localStorage.setItem("butlermaker_v1", JSON.stringify(stored));
        await new Promise(resolve => {
          appFrame.addEventListener("load", resolve, { once: true });
          appFrame.contentWindow.location.reload();
        });
        doc = appFrame.contentDocument;
        await wait(250);
        const roomGifts = [...doc.querySelectorAll("#cat-room-gifts [data-room-gift]")];
        assert.equal(roomGifts.length, 1, "CAT room shows only one desk toy even when several gifts are owned");
        assert.equal(roomGifts[0].dataset.roomGift, "방울 공", "CAT room chooses the owned desk-toy gift");
        assert.equal(roomGifts[0].dataset.deskToy, "true", "CAT room marks the displayed gift as a movable desk toy");
        assert(!roomGifts.some(node => node.dataset.roomGift === "참치 캔" || node.dataset.roomGift === "캣타워"), "food gifts and the deferred cat tower stay out of the room scene");
        stored = JSON.parse(localStorage.getItem("butlermaker_v1"));
        assert.equal(stored.giftHistory.length, 3, "hiding gifts from the room does not remove gift history");
      }
    });
  } else {
    location.replace("../index.html?cat-core-fixture=1");
  }
</script>
