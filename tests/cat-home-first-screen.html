<!doctype html>
<meta charset="utf-8">
<title>CAT home first screen fixture</title>
<body>
<script src="fixture-assertions.js"></script>
<script>
  /* 첫 화면 계약 — 아직 아무것도 없는 사람의 홈에서는, 접수 입력보다 먼저 놓인
     장식(브리핑·도장 게이지·날짜 도장)을 접어 FORM 01과 접수 버튼이 첫 화면
     안에 들어오게 한다.

     이 하네스의 iframe은 hidden이라 레이아웃이 없다 — 픽셀 위치는 여기서 잴 수
     없다. 그래서 여기서는 **접힘을 만드는 구조 계약**만 지키고, 실제 접수 버튼이
     하단 네비 위에 있는지는 Playwright 측정으로 따로 확인한다
     (360/390/430px, docs/NEXT-CODEX.md에 수치 기록). */
  const seed = {
    onboarded: true, username: "테스트", character: "cat", butlerName: "치즈냥",
    ownedButlers: ["cat"], records: [], briefings: [],
    diary: [], journalEntries: [], certificates: [], giftHistory: []
  };
  localStorage.setItem("butlermaker_v1", JSON.stringify(seed));
  if (new URLSearchParams(location.search).has("assert")) {
    runFixtureAssertions({
      target: "../index.html?fixture-no-overlay-observer=1",
      check: async (frame, assert, wait) => {
        const win = frame.contentWindow;
        await wait(200);
        const doc = frame.contentDocument;
        const folded = el => Boolean(el) && (el.hidden || win.getComputedStyle(el).display === "none");

        assert(doc.documentElement.hasAttribute("data-home-first-run"), "an empty file opens the first-screen home");
        assert(folded(doc.querySelector("#daily-briefing")), "the briefing folds away while there is nothing to brief");
        assert(folded(doc.querySelector("#view-home .entry-footnote")), "an empty stamp gauge does not push the submit button down");
        assert(folded(doc.querySelector("#view-home .home-hero i.of-datestamp")), "the date stamp waits until there is a filing history");
        assert(folded(doc.querySelector("#view-home .quick-actions-label")), "the quick-chip label folds; the chips themselves stay");
        assert(!folded(doc.querySelector("#view-home .quick-actions")), "one-tap first deed chips stay on the first screen");
        assert(Boolean(doc.querySelector("#achievement-input")) && !doc.querySelector("#report-button").hidden, "FORM 01 and its submit button are present");
        // 제목 줄바꿈을 접어도 낱말이 붙지 않는다 ("오늘은 어떻게보내셨나요").
        assert(/어떻게\s보내셨나요/.test(doc.querySelector("#home-title").textContent), "the folded title keeps its word spacing");

        /* ── 「치즈냥을 쓴 적 있는가」 판정 ──
           처음엔 records 0만 봤는데, 대업으로 안 올라간 이야기만 쌓은 사람이나
           일기만 남은 사람이 전부 「완전 신규」로 판정돼 쓰던 사람의 홈이 접혔다.
           흔적은 고양이 것만 센다 — 강아지만 쓰던 사람의 치즈냥 첫 화면은
           막히면 안 된다. 아래는 그 판정을 상태별로 못 박는다. */
        const now = new Date();
        const key = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        const catRecord = character => ({
          id: `r-${character}`, deed: "생활권 질서 회복 완료", sourceText: "방청소 했어",
          nickname: "생활력의 수호자", grade: "국가적 성취", date: "2026.09.01", number: 1,
          report: "접수다냥.", character, category: "home"
        });
        const seedAndRead = async patch => {
          const next = { ...JSON.parse(win.localStorage.getItem("butlermaker_v1")) };
          next.records = []; next.journalEntries = []; next.diary = []; next.giftHistory = []; next.briefings = [];
          Object.assign(next, patch);
          win.localStorage.setItem("butlermaker_v1", JSON.stringify(next));
          win.location.reload();
          await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
          await wait(250);
          return frame.contentDocument.documentElement.hasAttribute("data-home-first-run");
        };

        assert.equal(await seedAndRead({}), true, "A · a genuinely empty CAT file opens the first screen");
        assert.equal(await seedAndRead({
          journalEntries: [{ id: "j1", date: "2026.09.01", sourceText: "비 와서 집에 있었어", character: "cat", reactionLines: [] }]
        }), false, "B · stories kept without a deed still count as having used CAT");
        assert.equal(await seedAndRead({
          diary: [{ date: "2026.09.01", mood: "happy", text: "좋은 날이었다냥.", character: "cat" }]
        }), false, "C · a butler diary left behind counts as having used CAT");
        assert.equal(await seedAndRead({
          giftHistory: [{ id: "g1", character: "cat", name: "참치캔", emoji: "🐟", date: "2026.09.01" }]
        }), false, "D · a gift already given counts even after the records are gone");
        assert.equal(await seedAndRead({
          records: [catRecord("dog")],
          diary: [{ date: "2026.09.01", mood: "happy", text: "왕왕!", character: "dog" }]
        }), true, "E · another butler's history never blocks the first CAT screen");
        assert.equal(await seedAndRead({ records: [catRecord("cat")] }), false, "F · the first CAT record leaves the first screen");
        assert.equal(await seedAndRead({
          briefings: [{ id: "b1", date: key, title: "치과 예약", completed: false }]
        }), false, "G · a registered plan leaves the first screen");
        // 캐릭터 표시가 없는 옛 항목은 고양이 것으로 본다 — 쓰던 사람의 홈을 접지 않는 쪽.
        assert.equal(await seedAndRead({
          journalEntries: [{ id: "j0", date: "2026.08.01", sourceText: "옛 기록", reactionLines: [] }]
        }), false, "legacy entries without a character are treated as CAT usage");

        /* 일정이 하나라도 있으면 이 사람은 브리핑을 이미 쓰는 중이다 — 접지 않는다. */
        const withPlan = JSON.parse(win.localStorage.getItem("butlermaker_v1"));
        withPlan.records = []; withPlan.journalEntries = []; withPlan.diary = []; withPlan.giftHistory = [];
        withPlan.briefings = [{ id: "b1", date: key, title: "치과 예약", completed: false }];
        win.localStorage.setItem("butlermaker_v1", JSON.stringify(withPlan));
        win.location.reload();
        await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        await wait(250);
        const doc2 = frame.contentDocument;
        const folded2 = el => Boolean(el) && (el.hidden || frame.contentWindow.getComputedStyle(el).display === "none");
        assert(!doc2.documentElement.hasAttribute("data-home-first-run"), "a registered plan leaves the first-screen mode");
        assert(!folded2(doc2.querySelector("#daily-briefing")), "a registered plan keeps the briefing on screen");

        /* 첫 접수가 들어오면 원래 홈 구조로 돌아온다. */
        const withRecord = JSON.parse(win.localStorage.getItem("butlermaker_v1"));
        withRecord.briefings = [];
        withRecord.records = [{
          id: "r1", deed: "생활권 질서 회복 완료", sourceText: "방청소 했어", nickname: "생활력의 수호자",
          grade: "국가적 성취", date: "2026.09.01", number: 1, report: "접수다냥.", character: "cat", category: "home"
        }];
        win.localStorage.setItem("butlermaker_v1", JSON.stringify(withRecord));
        win.location.reload();
        await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        await wait(250);
        const doc3 = frame.contentDocument;
        const folded3 = el => Boolean(el) && (el.hidden || frame.contentWindow.getComputedStyle(el).display === "none");
        assert(!doc3.documentElement.hasAttribute("data-home-first-run"), "the first record restores the ordinary home");
        /* 뺄셈 라운드(2026-09-02) — 첫 접수 뒤에도 홈은 그대로 조용하다. 일정이 없으면
           브리핑은 없고, 도장 n/5는 홈이 아니라 파일 표지 한 곳에만 산다. */
        assert(folded3(doc3.querySelector("#daily-briefing")), "no plans → the briefing stays off the home even after the first record");
        assert(folded3(doc3.querySelector("#view-home .entry-footnote")), "the stamp gauge stays off the home after the first record");
        assert(doc3.querySelector("#owner-file-stamp-progress").textContent.trim() === "1 / 5", "the file cover carries the only n/5 (1 / 5 after the first record)");
        assert(frame.contentWindow.getComputedStyle(doc3.querySelector(".owner-file-stamp-row")).display !== "none", "the first-record file cover still shows the stamp row");

        /* 일정이 하나 생기면 카드가 아니라 메모 한 줄로 나타난다. */
        const withMemoPlan = JSON.parse(win.localStorage.getItem("butlermaker_v1"));
        const memoNow = new Date();
        const todayKey = `${memoNow.getFullYear()}-${String(memoNow.getMonth() + 1).padStart(2, "0")}-${String(memoNow.getDate()).padStart(2, "0")}`;
        withMemoPlan.briefings = [{ id: "b1", date: todayKey, title: "치과 예약", time: "14:00", completed: false, completedAt: null, askAfter: false, createdAt: memoNow.toISOString() }];
        win.localStorage.setItem("butlermaker_v1", JSON.stringify(withMemoPlan));
        win.location.reload();
        await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        await wait(250);
        const doc4 = frame.contentDocument;
        const folded4 = el => Boolean(el) && (el.hidden || frame.contentWindow.getComputedStyle(el).display === "none");
        assert(!folded4(doc4.querySelector("#daily-briefing")) && doc4.querySelector("#daily-briefing").classList.contains("is-memo"), "a plan shows up as the one-line memo, not the card");
        assert(!folded4(doc4.querySelector("#daily-briefing-memo")) && doc4.querySelector("#daily-briefing-memo-title").textContent.includes("치과 예약"), "the memo names the plan");
        assert(folded4(doc4.querySelector("#daily-briefing-add")), "「+ 일정 적기」 waits behind the memo");
        withMemoPlan.briefings = [];
        win.localStorage.setItem("butlermaker_v1", JSON.stringify(withMemoPlan));

        // 저장 데이터는 이 판정 때문에 바뀌지 않는다.
        const stored = JSON.parse(win.localStorage.getItem("butlermaker_v1"));
        assert.equal(stored.records.length, 1, "the first-screen judgement never writes to stored records");
        assert.equal((stored.briefings || []).length, 0, "the first-screen judgement never writes to stored plans");
      }
    });
  } else {
    location.replace("../index.html");
  }
</script>
</body>
