<!doctype html>
<meta charset="utf-8">
<title>Briefing story flow fixture</title>
<body>
<script src="fixture-assertions.js"></script>
<script>
  const dateKey = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  const today = dateKey(new Date());
  const seed = {
    onboarded: true,
    username: "테스트",
    character: "cat",
    butlerName: "치즈냥",
    ownedButlers: ["cat"],
    briefings: [{
      id: "briefing-hospital", date: today, title: "병원", time: "11:00",
      completed: false, completedAt: null, carriedFromPreviousDay: false,
      askAfter: true, askedAt: null, promptPending: false, closedAt: null,
      storyStartedAt: null, createdAt: new Date().toISOString()
    }]
  };
  localStorage.setItem("butlermaker_v1", JSON.stringify(seed));
  if (new URLSearchParams(location.search).has("assert")) {
    runFixtureAssertions({
      target: "../index.html?briefing-story-fixture=1&fixture-no-overlay-observer=1",
      check: async (frame, assert, wait) => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        await wait(80);
        const briefing = doc.querySelector("#daily-briefing");
        const hero = doc.querySelector("#view-home .home-hero");
        assert(Boolean(briefing.compareDocumentPosition(hero) & Node.DOCUMENT_POSITION_FOLLOWING), "briefing strip appears before the story form");

        doc.querySelector('[data-briefing-action="complete"]').click();
        await wait(900);
        assert(!doc.querySelector(".briefing-item-reaction"), "completion does not duplicate the cat reaction on the briefing sheet");
        assert(doc.querySelector("#cat-home-speech").textContent.includes("병원"), "completion reaction is immediately spoken by the cat");

        assert(!doc.querySelector('[data-briefing-action="story"]'), "completed schedules do not add an unclear story shortcut");
        const input = doc.querySelector("#achievement-input");
        const context = doc.querySelector("#briefing-story-context");
        assert(!context || context.hidden, "the story form stays independent from the completed schedule");
        input.value = "병원은 생각보다 힘들었어";
        input.dispatchEvent(new Event("input", { bubbles: true }));
        doc.querySelector("#report-button").click();
        await wait(100);
        const stored = JSON.parse(win.localStorage.getItem("butlermaker_v1"));
        const story = stored.journalEntries.find(entry => entry.sourceText === "병원은 생각보다 힘들었어");
        assert.equal(story.sourceText, "병원은 생각보다 힘들었어", "actual owner text is stored from the story form");
        assert(stored.diary.some(entry => entry.sourceText === "병원은 생각보다 힘들었어"), "the story feeds the next diary group");

        doc.querySelector('[data-view="archive"]').click();
        await wait(50);
        const storyBundle = doc.querySelector(".owner-story-bundle");
        assert(Boolean(storyBundle) && !storyBundle.open, "owner file keeps non-achievement stories collapsed by default");
        assert(storyBundle.querySelector("summary").textContent.includes("내가 들려준 이야기") && storyBundle.querySelector("summary").textContent.includes("1건"), "collapsed story row shows its clear count");
        storyBundle.open = true;
        assert(storyBundle.querySelector(".owner-story-note").textContent.includes("병원은 생각보다 힘들었어"), "owner file preserves the exact story inside the fold");
        const diaryNote = doc.querySelector(".file-date-group .file-margin-note");
        assert(Boolean(diaryNote) && Boolean(diaryNote.compareDocumentPosition(storyBundle) & Node.DOCUMENT_POSITION_FOLLOWING), "butler diary appears before the folded owner stories");
      }
    });
  } else {
    location.replace("../index.html?briefing-story-fixture=1");
  }
</script>
</body>
