<!doctype html>
<meta charset="utf-8">
<title>과잉집사 인사 데이터 마이그레이션 픽스처</title>
<script src="fixture-assertions.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const days = Array.from({ length: 7 }, (_, index) => `2026.08.${String(index + 1).padStart(2, "0")}`);
  const achievements = ["물 마심", "씻음", "답장함", "침대에서 일어남"].map((deed, index) => ({
    id: `legacy-${index}`,
    text: deed,
    createdAt: `2026-08-0${index + 1}T09:00:00.000Z`,
    contribution: `${90 + index}점`,
    docNo: `대업-2026-${String(index + 1).padStart(4, "0")}`,
    grade: index === 0 ? "인류사적 대업" : index === 1 ? "우주 최초 기록" : "소소한 기적",
    nickname: "생활력의 수호자",
    report: `원조 기록 ${index + 1}`,
    isCertificate: true,
    character: "cat",
    butlerName: "치즈대리"
  }));
  const seed = {
    onboarded: true,
    character: "cat",
    butlerName: "치즈대리",
    obsession: 35,
    achievements,
    ownedButlers: ["ai", "cat", "dog"],
    pendingApplicants: [],
    deferredApplicants: [],
    applicationHistory: [],
    handoverHistory: [{ from: "cat", to: "ai", at: "2026-08-08T09:00:00.000Z", fromName: "치즈대리", toName: "오류팀장" }],
    butlerStats: {
      ai: { obsession: 22, gifts: 1, achievements: 2, activeDates: ["2026.07.31"], assignments: 1, customName: "오류팀장" },
      cat: { obsession: 35, gifts: 0, achievements: 4, activeDates: days, assignments: 1, customName: "치즈대리" }
    },
    diary: [{ id: "old-ai-diary", date: "2026.07.31", deed: "메일 확인", text: "[원조 AI] 기록 보존 테스트", character: "ai", butlerName: "오류팀장" }]
  };
  localStorage.setItem("butlermaker_v1", JSON.stringify(seed));
  if (params.has("assert")) {
    runFixtureAssertions({
      target: "../index.html?personnel-fixture=1&fixture-no-overlay-observer=1",
      check: async (frame, assert, wait) => {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const migrated = win.OVERBUTLER_APP.migrateState(seed);
        assert.equal(migrated.records.length, 4, "legacy achievements become four records");
        assert.equal(migrated.records[0].sourceText, "물 마심", "legacy record text becomes sourceText");
        assert.equal(migrated.records[0].grade, "인류사적 대업", "stored legacy grade remains unchanged");
        assert.equal(win.OVERBUTLER_APP.displayGrade(migrated.records[0]), "사무국 정식 대업", "CAT normal grade uses office display wording");
        assert.equal(win.OVERBUTLER_APP.displayGrade(migrated.records[1]), "과몰입 특별 대업", "CAT power grade uses office display wording");
        assert.equal(migrated.certificates.length, 0, "legacy keepsakes stay out of official certificates");
        doc.querySelector('[data-view="archive"]').click();
        await wait(50);
        assert.equal(doc.querySelector("#records-official-count").textContent, "0", "official summary matches migrated certificates");
        assert(doc.querySelector("#record-legend").textContent.includes("1건 남음"), "first-five progress counts the four migrated records");
        assert.equal(doc.querySelectorAll(".record-legacy-cert").length, 4, "all four legacy keepsakes remain visible");
        const keepsakeButton = doc.querySelector('button.record-legacy-cert[data-cert-id="legacy-0"]');
        assert(Boolean(keepsakeButton), "CAT legacy keepsake has a reopen action");
        keepsakeButton.click();
        await wait(30);
        assert.equal(doc.querySelector("#certificate-title").textContent, "기념 증서", "legacy keepsake opens in commemorative mode");
        assert.equal(doc.querySelector("#certificate-document-kind").textContent, "보관 문서", "legacy keepsake is not labelled as an official document");
        assert.equal(doc.querySelector("#certificate-issue").textContent, "이전 버전 기념 증서", "legacy keepsake does not enter the official issue count");
        doc.querySelector("[data-certificate-close]").click();
        await wait(30);
        win.OVERBUTLER_APP.openHandover("ai");
        await wait(30);
        assert(doc.querySelector("#recruitment-sheet").textContent.includes("대기 발령"), "handover form explains the previous butler's waiting assignment");
        doc.querySelector('[data-personnel-action="pool"]').click();
        await wait(30);
        assert.equal(doc.querySelectorAll(".personnel-incident-board article").length, 1, "CAT handover history produces one office incident");
        assert(doc.querySelector(".personnel-incident-board").textContent.includes("복귀 가능"), "office incident preserves return eligibility");
      }
    });
  } else {
    location.replace("../index.html?personnel-fixture=1");
  }
</script>
